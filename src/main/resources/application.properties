# ============================================================
# WhatsApp Chatbot - Jarurat Care
# Application Configuration
# ============================================================

# Server Configuration
server.port=${PORT:8080}

# Application Info
spring.application.name=whatsapp-chatbot

# Logging Configuration
logging.level.com.jarurat.chatbot=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator (for Render health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=WhatsApp Chatbot
info.app.description=WhatsApp Chatbot Backend Simulation - Jarurat Care Assignment
info.app.version=1.0.0

# Disable whitelabel error page
server.error.whitelabel.enabled=false